    <style>
        /* ==========================================================================
           MINIMALIST BLACK & WHITE DESIGN SYSTEM
           ========================================================================== */
        :root {
            --bg-color: #080808;
            --card-bg: #111111;
            --card-border: rgba(255, 255, 255, 0.1);
            --card-border-hover: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --btn-bg: #161616;
            --btn-border: rgba(255, 255, 255, 0.12);
            --btn-hover-bg: #ffffff;
            --btn-hover-text: #000000;
            --font-display: 'Syne', -apple-system, sans-serif;
            --font-body: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient Fine Grid Background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
        }

        /* ==========================================================================
           ENTERING ANIMATION: CHOREOGRAPHED CURTAIN REVEAL
           ========================================================================== */
        .curtain {
            position: fixed;
            inset: 0;
            background-color: #020202;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            transition: transform 0.85s cubic-bezier(0.85, 0, 0.15, 1);
        }

        .curtain-logo {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .curtain-logo img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 0.85rem;
            object-fit: cover;
            display: block;
        }

        .curtain-line {
            width: 0%;
            height: 1px;
            background-color: #ffffff;
            transition: width 0.6s var(--ease-out-expo);
        }

        .curtain-text {
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #ffffff;
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        body.ready .curtain-logo {
            opacity: 1;
            transform: scale(1);
        }

        body.ready .curtain-line {
            width: 140px;
        }

        body.ready .curtain-text {
            opacity: 1;
            transform: translateY(0);
        }

        body.loaded .curtain {
            transform: translateY(-100%);
        }

        /* ==========================================================================
           MAIN CARD (UPGRADED AESTHETIC)
           ========================================================================== */
        .card {
            position: relative;
            z-index: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.75rem 2.25rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.03);
            opacity: 0;
            transform: translateY(28px) scale(0.97);
            transition: opacity 0.8s var(--ease-out-expo), 
                        transform 0.8s var(--ease-out-expo),
                        border-color 0.3s ease;
        }

        body.loaded .card {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .card:hover {
            border-color: var(--card-border-hover);
        }

        /* Subtle Corner Accent */
        .card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 24px;
            right: 24px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        /* Brand Logo in Card */
        .logo-wrap {
            margin-bottom: 1.25rem;
            display: inline-block;
        }

        .brand-logo {
            width: 68px;
            height: 68px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            display: block;
            margin: 0 auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            opacity: 0;
            transform: scale(0.88) translateY(10px);
            transition: opacity 0.6s ease, transform 0.6s var(--ease-out-expo);
            transition-delay: 0.10s;
        }

        body.loaded .brand-logo {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Masked Headline Animation */
        .headline-mask {
            overflow: hidden;
            margin-bottom: 0.35rem;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            line-height: 1.15;
            transform: translateY(100%);
            transition: transform 0.7s var(--ease-out-expo);
            transition-delay: 0.16s;
        }

        body.loaded h1 {
            transform: translateY(0);
        }

        .role-text {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #e5e5e5;
            margin-bottom: 0.2rem;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            transition-delay: 0.22s;
        }

        body.loaded .role-text {
            opacity: 1;
            transform: translateY(0);
        }

        .subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.01em;
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.6s ease, transform 0.6s ease;
            transition-delay: 0.26s;
        }

        body.loaded .subtitle {
            opacity: 1;
            transform: translateY(0);
        }

        /* ==========================================================================
           LINKS & BUTTONS
           ========================================================================== */
        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--btn-bg);
            color: var(--text-primary);
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.92rem;
            letter-spacing: -0.01em;
            border: 1px solid var(--btn-border);
            opacity: 0;
            transform: translateY(14px);
            transition: background-color 0.25s ease, 
                        color 0.25s ease, 
                        border-color 0.25s ease, 
                        transform 0.25s var(--ease-out-expo),
                        opacity 0.6s ease;
        }

        /* Staggered entrance for links */
        body.loaded .link-btn:nth-child(1) { opacity: 1; transform: translateY(0); transition-delay: 0.32s; }
        body.loaded .link-btn:nth-child(2) { opacity: 1; transform: translateY(0); transition-delay: 0.38s; }
        body.loaded .link-btn:nth-child(3) { opacity: 1; transform: translateY(0); transition-delay: 0.44s; }
        body.loaded .link-btn:nth-child(4) { opacity: 1; transform: translateY(0); transition-delay: 0.50s; }

        .link-btn:hover {
            background-color: var(--btn-hover-bg);
            color: var(--btn-hover-text);
            border-color: #ffffff;
            transform: translateY(-2px);
        }

        .link-btn:active {
            transform: translateY(0);
        }

        /* Keyboard Accessibility */
        .link-btn:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        /* Clean Vector SVGs */
        .icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .link-btn:hover .icon {
            transform: scale(1.08);
        }

        /* Reduced Motion Fallback */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
            .curtain {
                display: none !important;
            }
            .card, .brand-logo, h1, .role-text, .subtitle, .link-btn {
                opacity: 1 !important;
                transform: none !important;
            }
        }

        /* Small Screen Polish (375px) */
        @media (max-width: 400px) {
            body {
                padding: 16px;
            }
            .card {
                padding: 2.25rem 1.5rem;
            }
            h1 {
                font-size: 1.75rem;
            }
            .brand-logo {
                width: 60px;
                height: 60px;
            }
            .link-btn {
                padding: 13px 16px;
                font-size: 0.88rem;
            }
        }
    </style>
</head>

    <!-- Entrance Controller -->
    <script>
        (function() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
